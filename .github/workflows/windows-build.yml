name: JT-4000M Studio Windows build

on:
  pull_request:
    branches: [main]
    paths:
      - "gui 1/**"
      - ".github/workflows/windows-build.yml"
  push:
    branches: [main]
    paths:
      - "gui 1/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "gui 1/pyproject.toml"
      - name: Install package and build/test tools
        working-directory: "gui 1"
        run: python -m pip install -e ".[build]"
      - name: Run tests
        working-directory: "gui 1"
        run: python -m pytest -q
      - name: Build standalone onedir app
        working-directory: "gui 1"
        run: python -m PyInstaller --noconfirm --clean JT4000M-Studio.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "gui 1/dist/JT4000M-Studio/JT4000M-Studio.exe"
          if (-not (Test-Path $exe)) { throw "Missing packaged executable: $exe" }
      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: JT4000M-Studio-Windows
          path: "gui 1/dist/JT4000M-Studio/"
          if-no-files-found: error
