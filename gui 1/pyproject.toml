[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jt4000m-editor"
version = "0.1.4"
description = "Behringer JT-4000M SysEx analyzer and parameter model"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
midi = ["python-rtmidi>=1.5"]

[project.scripts]
jt4000m = "jt4000m.cli:main"
jt4000m-gui = "jt4000m.gui:main"

[tool.setuptools]
packages = ["jt4000m"]

[tool.pytest.ini_options]
# The environment ships a broken third-party pytest plugin (libtmux applies
# pytest marks to fixtures, which newer pytest rejects at startup).
# Disable it so `python -m pytest` works without extra flags.
addopts = "-p no:libtmux"
markers = [
    "syx_safety: SysEx format-safety contracts (name boundary 55..63, byte-54 isolation, unknown-byte preservation, round-trip identity, checksum ownership, no-op byte identity). Run with: pytest -m syx_safety",
    "gui_xvfb: tests that require a display (Tkinter GUI); skipped headless unless DISPLAY is available",
    "hardware: tests requiring a physical JT-4000M; skipped unless JT4000M_HARDWARE_TEST=1",
]
